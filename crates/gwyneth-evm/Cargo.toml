[package]
name = "alloy-gwyneth-evm"
description = "Gwyneth EVM integration"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-evm = { workspace = true }
alloy-primitives.workspace = true
auto_impl.workspace = true

revm.workspace = true

# gwyneth engine + related crates
gwyneth-engine = { git = "https://github.com/taikoxyz/revm-private", branch = "gwyneth-revm-oggy-v98", default-features = false }
gwyneth-detector = { git = "https://github.com/taikoxyz/revm-private", branch = "gwyneth-revm-oggy-v98", default-features = false }
gwyneth-types = { git = "https://github.com/taikoxyz/revm-private", branch = "gwyneth-revm-oggy-v98", default-features = false }

[features]
default = ["std"]
std = [
    "alloy-evm/std",
    "alloy-primitives/std",
    "revm/std",
    "gwyneth-engine/std",
    "gwyneth-detector/std",
    "gwyneth-types/std",
]
