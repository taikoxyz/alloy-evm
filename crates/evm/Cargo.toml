[package]
name = "alloy-evm"
description = "EVM abstraction for Alloy"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-eips.workspace = true
alloy-hardforks.workspace = true
alloy-rpc-types-eth = { workspace = true, optional = true }

revm.workspace = true
# op-revm = { workspace = true, optional = true }  # Disabled due to incompatibility with HashMap<u64, BlockEnv>
op-alloy-consensus = { workspace = true, optional = true }

# gwyneth types (schema + multichain helpers)
gwyneth-types = { path = "../../../revm-private/revm-private/gwyneth/crates/gwyneth-types", default-features = false }

auto_impl.workspace = true
derive_more.workspace = true
thiserror.workspace = true

[dev-dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
serde_json.workspace = true

[features]
default = ["std"]
secp256k1 = [
    "std",
    "alloy-consensus/secp256k1",
]
std = [
    "alloy-primitives/std",
    "revm/std",
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-sol-types/std",
    "derive_more/std",
    "gwyneth-types/std",
    # "op-revm?/std",  # Disabled due to incompatibility
    "thiserror/std",
    "op-alloy-consensus?/std",
    "alloy-rpc-types-eth?/std"
]
op = ["op-alloy-consensus"]  # op-revm disabled due to incompatibility
overrides = ["dep:alloy-rpc-types-eth"]
call-util = ["overrides"]
